    <title>Bck end</title>
    <script>
     function pesquisrCep(){
        const cep = document.getElementById("cep").value
        const link = "https://vicep.com.br/ws/" + cep + "/json/?callback=preencherEndereco"
        var script = document.createElement("script")
        script.src = link
        document.body.appendChild(script)
     }
     function preencherEndereco(conteudo){
     resposta.textContent = JSON.stringify(conteudo)
     }   
      </script>
</hed>
<body>
